# Mindustry Server Configuration
# Attack mode with complex enemy base

# Server name
name=Attack Server - Complex Enemy Base

# Server port
port=6567

# Max players
maxplayers=64

# Public server
public=true

# Auto-pause when no players (false for permanent)
pausable=false

# Game mode: attack, survival, sandbox, pvp
mode=attack

# Map name
map=attack-complex

# Wave timer in seconds (3 minutes = 180 seconds)
wavetimer=180

# Wave interval in seconds
waveInterval=60

# Wave difficulty scaling
waveDifficulty=0.5

# Lenient waves at start
initialWaveDifficulty=0.3

# Wave difficulty scaling curve
difficultyScaling=0.95

# Starting resources for players
startingResources=5000

# Autosave enabled
autosave=true

# Save interval in minutes
saveInterval=10

# RCON settings
rconEnabled=true
rconPort=6568
rconPassword=changeme

# Chat settings
chatPrefix=[SERVER]

# Ban list file
banlist=banlist.txt

# Admin list file
adminlist=adminlist.txt

# Log settings
logChat=true
logConnections=true

# Enable console input
console=true
# Complex Enemy Base Map Configuration
# For Attack Mode

# Map metadata
name=Complex Enemy Base
author=Server Admin
description=Attack mode with extremely complex enemy base and lenient starting waves

# Map dimensions
width=512
height=512

# Spawn points
# Player spawn
playerSpawnX=100
playerSpawnY=100

# Enemy base spawn (center of map)
enemyBaseX=256
enemyBaseY=256

# Enemy base settings
# Complexity level (1-10, 10 = extremely complex)
enemyBaseComplexity=10

# Base size in blocks
enemyBaseSize=200

# Base defense structures
enemyTurrets=50
enemyWalls=300
enemyFactories=25
enemyPowerNodes=15

# Base resource generators
enemyCores=3
enemyDrills=40
enemyConveyors=200

# Base unit production
enemyUnitFactories=8
enemyUnitCapacity=500

# Base AI settings
enemyAIDifficulty=8
enemyAIAggressiveness=7
enemyAIDefensePriority=9
enemyAIExpansion=true

# Terrain
ground=stone
walls=darkPanel

# Environment
fog=true
fogColor=0.2,0.2,0.3,0.8
lighting=0.6

# Wave settings for this map
# Override global settings
waveTimer=180
waveInterval=60
initialWaveDifficulty=0.3
difficultyScaling=0.95

# Starting resources for players
startingResources=5000

# Map rules
buildSpeed=1.0
unitBuildSpeed=1.0
unitCostMultiplier=1.0
blockHealthMultiplier=1.0
blockDamageMultiplier=1.0

# Enemy wave composition
enemyWaveGroundUnits=0.6
enemyWaveAirUnits=0.3
enemyWaveBossUnits=0.1

# Special enemy base features
# True = enemy base has shields
 enemyBaseShields=true
# True = enemy base has regenerating structures
enemyBaseRegeneration=true
# True = enemy base spawns bosses
enemyBaseBossSpawns=true
# True = enemy base has artillery
enemyBaseArtillery=true

# Victory conditions
# False = endless waves (for permanent server)
endlessWaves=true